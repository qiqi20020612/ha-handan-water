name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.10.0", "2026.10.1", "2026.10.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt "homeassistant==${{ matrix.homeassistant }}"
      - name: Show resolved compatibility versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print('HA:', version('homeassistant'))
          print('Test plugin:', version('pytest-homeassistant-custom-component'))
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_public_files.py
      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('custom_components/handan_water/manifest.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and manifest version differ'
          PY
      - run: pytest -q --cov=custom_components.handan_water --cov-report=term-missing
      - name: Build release candidate
        if: matrix.homeassistant == '2026.10.2'
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        if: matrix.homeassistant == '2026.10.2'
        with:
          name: release-candidate
          path: |
            dist/ha-handan-water-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
